name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight deployment at a time; let a newer push supersede an older one
# rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install

      # Nothing ships that does not pass. The site is the game.
      - name: Checks
        run: npm run check

      - name: Build the downloadable single file
        run: npm run build

      # The repo IS the site — no build step, by design — so this is a copy,
      # not a bundle. Only the files a browser actually requests.
      - name: Assemble
        run: |
          mkdir -p _site
          cp index.html editor.html _site/
          cp -r css js content img _site/
          cp dist/ways-and-means.html _site/
          # Cache-bust every script and style URL with the commit. Pages caches
          # each file for ten minutes, so without this a browser can hold old JS
          # against new content and render a half-updated game.
          find _site -name '*.html' -exec sed -i \
            "s/\(src=\"[^\"]*\.js\)\"/\1?v=${GITHUB_SHA}\"/g; s/\(href=\"[^\"]*\.css\)\"/\1?v=${GITHUB_SHA}\"/g" {} +
          # Pages runs Jekyll by default, which drops files it does not
          # recognise. We are plain static; opt out.
          touch _site/.nojekyll
          echo "--- deploying ---"
          find _site -type f | sort | sed 's/^/  /'

      # No `enablement: true`. The workflow token cannot turn Pages on for this
      # repo, and asking it to fails the whole deploy. Enable it once by hand:
      #   Settings > Pages > Build and deployment > Source: GitHub Actions
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
