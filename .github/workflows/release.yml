name: release
on:
  push:
    tags: ['v*']
  # Tag pushes are not always available to every credential, so a release can
  # also be cut by hand from the Actions tab: run this and give it a version.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish, e.g. v0.5.0'
        required: true
        default: 'v0.5.0'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - name: Checks must pass before anything ships
        run: npm run check
      - name: Build the single file
        run: npm run build
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Ways & Means ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: dist/ways-and-means.html
          body: |
            **Download `ways-and-means.html` below and open it in a browser.**
            One file, no install, no server, works offline.

            Saves live in that browser's local storage, per slot. Use
            Options → Export to file to move a game between machines.

            The engine is complete for chapters one and two; the prose is
            placeholder and is being rewritten.
